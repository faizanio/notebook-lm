<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Main Indigo/Violet Notebook Gradient -->
    <linearGradient id="notebookGrad" x1="120" y1="120" x2="390" y2="390" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <!-- Cyan AI Sparkle Gradient -->
    <linearGradient id="cyanGrad" x1="280" y1="80" x2="420" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
  </defs>

  <!-- Container Base (Clean Squircle) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="6" y="6" width="500" height="500" rx="106" stroke="#1e293b" stroke-width="4" />

  <!-- Minimalist Geometric Notebook Emblem -->
  <!-- Left Page Leaf -->
  <path d="M 136 160 C 136 142.3 150.3 128 168 128 L 244 128 C 250.6 128 256 133.4 256 140 L 256 372 C 256 378.6 250.6 384 244 384 L 168 384 C 150.3 384 136 369.7 136 352 Z" 
        fill="url(#notebookGrad)" />

  <!-- Right Page Leaf (Layered Depth) -->
  <path d="M 256 140 C 256 133.4 261.4 128 268 128 L 344 128 C 361.7 128 376 142.3 376 160 L 376 352 C 376 369.7 361.7 384 344 384 L 268 384 C 261.4 384 256 378.6 256 372 Z" 
        fill="#3b82f6" opacity="0.85" />

  <!-- Center Notebook Fold Spine -->
  <path d="M 252 128 L 260 128 L 260 384 L 252 384 Z" fill="#090d16" />

  <!-- Minimalist Vector Content Lines (Left Page) -->
  <rect x="168" y="180" width="56" height="8" rx="4" fill="#ffffff" opacity="0.9" />
  <rect x="168" y="212" width="64" height="8" rx="4" fill="#ffffff" opacity="0.6" />
  <rect x="168" y="244" width="44" height="8" rx="4" fill="#ffffff" opacity="0.6" />
  <rect x="168" y="276" width="52" height="8" rx="4" fill="#ffffff" opacity="0.4" />

  <!-- Minimalist Vector Content Lines (Right Page) -->
  <rect x="288" y="180" width="56" height="8" rx="4" fill="#ffffff" opacity="0.9" />
  <rect x="288" y="212" width="64" height="8" rx="4" fill="#ffffff" opacity="0.6" />
  <rect x="288" y="244" width="44" height="8" rx="4" fill="#ffffff" opacity="0.6" />
  <rect x="288" y="276" width="52" height="8" rx="4" fill="#ffffff" opacity="0.4" />

  <!-- Geometric AI Sparkle Node (Precision 4-Point Star) -->
  <path d="M 360 88 C 360 114.5 381.5 136 408 136 C 381.5 136 360 157.5 360 184 C 360 157.5 338.5 136 312 136 C 338.5 136 360 114.5 360 88 Z" 
        fill="url(#cyanGrad)" />
</svg>